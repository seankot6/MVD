# Деплой на Render.com из GitHub: https://github.com/seankot6/MVD
# Start Command: gunicorn -w 1 -b 0.0.0.0:$PORT wsgi:app

services:
  - type: web
    name: citizen-appeals
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: BEHIND_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: ADMIN_RESET_KEY
        sync: false
      - key: STAFF_CODE_WINDOW_MINUTES
        value: "15"
      - key: STAFF_SKIP_EMAIL_VERIFY
        value: "1"
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
