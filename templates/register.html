{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Регистрация пользователя</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Номер телефона <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" placeholder="+7 (___) ___-__-__" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ФИО <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Адрес проживания</label>
                        <input type="text" name="address" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email (необязательно)</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100">Зарегистрироваться</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
