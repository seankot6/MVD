{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header text-white text-center"><h4 class="mb-0">Забыли пароль?</h4></div>
            <div class="card-body p-4">
                <p class="secondary-text">Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.</p>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
                </form>
                <div class="text-center mt-3"><a href="{{ url_for('login') }}">← Ко входу</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
