{% extends "base.html" %}

{% block title %}Вход сотрудника — МО МВД Октябрьский{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header text-white text-center"><h4 class="mb-0">Вход сотрудника МО МВД</h4></div>
            <div class="card-body p-4">
                <div class="alert alert-light border mb-4">
                    Введите служебный email, пароль и код доступа. Код постоянный — его выдаёт администратор.
                </div>
                <form method="POST" id="staff-login-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" name="login" class="form-control" required autocomplete="username"
                               placeholder="oktyabrsky28@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="staff-access-box mb-4">
                        <label class="form-label fw-semibold">Код доступа сотрудника <span class="text-danger">*</span></label>
                        <input type="text" name="staff_code" id="staff_code" class="form-control"
                               autocomplete="off" placeholder="Код от администратора" required>
                    </div>
                    <div class="mb-4 form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="staff-login-btn" disabled>Войти в панель</button>
                </form>
                <div class="text-center mt-3 secondary-text">
                    <a href="{{ url_for('login') }}">← Вход для граждан</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/staff-login-form.js') }}?v=2"></script>
{% endblock %}
